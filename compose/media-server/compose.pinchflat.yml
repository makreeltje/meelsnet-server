services:
  pinchflat:
    extends:
      file: ../fragments/common-service.yml
      service: common
    container_name: pinchflat
    image: ghcr.io/kieraneglin/pinchflat:latest@sha256:01b4f98aabaf3f5fe394213f7a32578c9e84e42080f52e2f8334021a4473b202
    profiles: [ "media", "all" ]
    volumes:
      - $CONF_DIR/pinchflat/config:/config
      - $MEDIA_DIR/youtube:/downloads
    ports:
      - 10.10.0.20:8945:8945
