services:
  sabnzbd:
    extends:
      file: ../fragments/common-service.yml
      service: common-lsio
    container_name: sabnzbd
    image: linuxserver/sabnzbd:5.1.3
    profiles: [ "media", "all" ]
    environment:
      PUID: 1000
      PGID: 1000
      UMASK: "002"
    volumes:
      - $CONF_DIR/sabnzbd/config:/config
      - $DOWNLOAD_DIR:/downloads
    ports:
      - 8082:8080
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: [ "CMD", "curl", "-fsSo", "/dev/null", "http://localhost:8080/api?mode=version&output=json" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
