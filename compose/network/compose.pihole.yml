services:
  pihole:
    extends:
      file: ../fragments/common-service.yml
      service: common
    container_name: pihole
    image: pihole/pihole:2026.10.0
    profiles: [ "network", "all" ]
    cap_add:
      - SYS_NICE
    environment:
      FTLCONF_webserver_api_password: $PIHOLE_WEB_PASS
      # DoT only: FTL talks plain DNS to the unbound-tls sidecar (shares this
      # container's network namespace, so the hop never leaves the container).
      # Deliberately no plain-UDP upstream here: FTL would use it routinely and
      # silently drop DoT. The gateway (192.168.2.254) is the fallback, via DHCP.
      FTLCONF_dns_upstreams: 127.0.0.1#5053
      FTLCONF_dns_listeningMode: all
    volumes:
      - $CONF_DIR/pihole/data:/etc/pihole
    # Bootstrap only (not the query path). Keep as is.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    ports:
      - $LXC_IP:80:80/tcp
      # DNS ports: deliberately bound on all interfaces of this dual-homed LXC.
      # Clients reach it on the home LAN address; the monitoring LXC's blackbox
      # probe reaches it on the server LAN address. Not published beyond the LXC.
      - "53:53/tcp"
      - "53:53/udp"
    healthcheck:
      # Proves FTL resolves, not just that the web UI answers.
      test: [ "CMD-SHELL", "dig +short +time=3 +tries=1 @127.0.0.1 cloudflare.com | grep -q ." ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # DNS-over-TLS forwarder for Pi-hole. Shares pihole's network namespace so
  # Pi-hole can reach it on 127.0.0.1 (FTL upstreams must be IPs, not names).
  unbound-tls:
    image: klutchell/unbound:1.26.1
    container_name: unbound-tls
    profiles: [ "network", "all" ]
    network_mode: "service:pihole"
    restart: unless-stopped
    depends_on:
      - pihole
    configs:
      - source: unbound_tls_conf
        target: /etc/unbound/unbound.conf
    healthcheck:
      test: [ "CMD", "drill-hc", "-p", "5053", "cloudflare.com", "@127.0.0.1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Cloudflare only, IP@853#name form so the forwarder needs no resolver to start.
configs:
  unbound_tls_conf:
    content: |
      server:
        do-daemonize: no
        username: "unbound"
        chroot: ""
        logfile: ""
        pidfile: ""
        verbosity: 1
        interface: 127.0.0.1@5053
        access-control: 127.0.0.0/8 allow
        do-ip4: yes
        do-ip6: no
        do-udp: yes
        do-tcp: yes
        prefetch: yes
        # Keep answering cached names (1 h) if both upstreams are unreachable.
        serve-expired: yes
        serve-expired-ttl: 3600
        tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt
      forward-zone:
        name: "."
        forward-tls-upstream: yes
        forward-addr: 1.1.1.1@853#cloudflare-dns.com
        forward-addr: 1.0.0.1@853#cloudflare-dns.com
