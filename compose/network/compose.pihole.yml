services:
  pihole:
    extends:
      file: ../fragments/common-service.yml
      service: common
    container_name: pihole
    user: $PUID:$PGID
    image: pihole/pihole:2026.10.0
    profiles: [ "network", "all" ]
    cap_add:
      - SYS_NICE
    environment:
      FTLCONF_webserver_api_password: ${PIHOLE_WEB_PASS:?PIHOLE_WEB_PASS must be set}
      FTLCONF_dns_upstreams: 1.1.1.1;1.0.0.1
      # Bridge mode: queries arrive from the docker gateway / Proxmox SNAT address
      # (Tailscale subnet routing), not from a "local" subnet. Port 53 is only
      # published on the two LXC addresses below, so "all" does not widen exposure.
      FTLCONF_dns_listeningMode: all
      # Wildcard for Tailscale split DNS: every host under both domains -> Traefik on LXC infra.
      # Clients are on the LAN/Tailscale, so answer with infra's LAN (vmbr0) address, not
      # $LXC_INFRA_IP (service net, 10.10.0.x, not routable from the LAN).
      # The "::" entries answer AAAA locally; without them AAAA is forwarded upstream and
      # returns the Cloudflare IPv6 address, which clients prefer over the A record.
      # Must stay double-quoted: an unquoted value ending in "::" is not valid YAML.
      FTLCONF_misc_dnsmasq_lines: "\
        address=/meels.net/${LXC_INFRA_LAN_IP:?LXC_INFRA_LAN_IP must be set};\
        address=/meels.net/::;\
        address=/meelsnet.nl/${LXC_INFRA_LAN_IP:?LXC_INFRA_LAN_IP must be set};\
        address=/meelsnet.nl/::"
    volumes:
      - $CONF_DIR/pihole/data:/etc/pihole
    dns:
      - 1.1.1.1
      - 1.0.0.1
    ports:
      # Admin UI: service net only (not exposed on the LAN)
      - $LXC_IP:80:80/tcp
      - $LXC_LAN_IP:80:80/tcp
      # DNS: service net + LXC LAN address (vmbr0), never 0.0.0.0 / the systemd-resolved stub
      - $LXC_IP:53:53/tcp
      - $LXC_IP:53:53/udp
      - $LXC_LAN_IP:53:53/tcp
      - $LXC_LAN_IP:53:53/udp
    healthcheck:
      test: [ "CMD", "curl", "-fsSo", "/dev/null", "http://localhost:80/admin/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
