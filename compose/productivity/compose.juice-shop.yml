services:
  juice-shop-1:
    extends:
      file: ../fragments/common-service.yml
      service: common
    container_name: juice-shop-1
    image: bkimminich/juice-shop:v20.2.0
    profiles: [ "productivity", "all" ]
    environment:
      NODE_ENV: quiet
    ports:
      - 3000:3000
    healthcheck:
      test: [ "CMD", "/nodejs/bin/node", "-e", "require('http').get('http://localhost:3000/', r=>process.exit(r.statusCode<500?0:1)).on('error', ()=>process.exit(1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
