services:
  hyperion:
    extends:
      file: ../fragments/common-service.yml
      service: common-host
    container_name: hyperion
    image: foorschtbar/hyperion:latest@sha256:c387658fcf02f23937b9b534ed54ecb74811ecba44f19b709d7136355546a798
    profiles: [ "home", "all" ]
    volumes:
      - $CONF_DIR/hyperion/config:/root/.hyperion
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8090/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
