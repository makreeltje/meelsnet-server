services:
  hyperion:
    extends:
      file: ../fragments/common-service.yml
      service: common-host
    container_name: hyperion
    image: foorschtbar/hyperion:latest@sha256:144e9a12a7d831729dfd651f718de025c09ff615dab9764ab0341a3ffadea2c1
    profiles: [ "home", "all" ]
    volumes:
      - $CONF_DIR/hyperion/config:/root/.hyperion
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8090/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
