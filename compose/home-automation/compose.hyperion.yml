services:
  hyperion:
    extends:
      file: ../fragments/common-service.yml
      service: common-host
    container_name: hyperion
    image: foorschtbar/hyperion:latest@sha256:eea137d7061731be4f309975aeb9d79c605df3196f62be1d5b0601b8f86f82b1
    profiles: [ "home", "all" ]
    volumes:
      - $CONF_DIR/hyperion/config:/root/.hyperion
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8090/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
