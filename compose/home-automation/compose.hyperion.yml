services:
  hyperion:
    extends:
      file: ../fragments/common-service.yml
      service: common-host
    container_name: hyperion
    image: foorschtbar/hyperion:latest@sha256:4ebbe633547de5deb8d038a2dab568546b282583fc13cfed07a8b785a57caa4a
    profiles: [ "home", "all" ]
    volumes:
      - $CONF_DIR/hyperion/config:/root/.hyperion
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8090/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
