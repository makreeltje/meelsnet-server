services:
  hyperion:
    extends:
      file: ../fragments/common-service.yml
      service: common-host
    container_name: hyperion
    image: foorschtbar/hyperion:latest@sha256:6674b9b5cbdb1b3324765f289fe5d080ec644e76f68049a1186a9dd662d0adff
    profiles: [ "home", "all" ]
    volumes:
      - $CONF_DIR/hyperion/config:/root/.hyperion
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8090/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
