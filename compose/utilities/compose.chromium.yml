services:
  chromium:
    extends:
      file: ../fragments/common-service.yml
      service: common
    container_name: chromium
    image: ghcr.io/browserless/chromium:v2.56.7
    profiles: [ "productivity", "all" ]
    environment:
      CONCURRENT: 5
      TOKEN: $CHROMIUM_TOKEN
    ports:
      - 3001:3000
    healthcheck:
      test: [ "CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:3000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
