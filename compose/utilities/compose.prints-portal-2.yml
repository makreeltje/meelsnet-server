services:
  prints-portal-2:
    extends:
      file: ../fragments/common-service.yml
      service: common
    container_name: prints-portal-2
    image: ghcr.io/makreeltje/prints-portal:1.0.0-72
    profiles: [ "utilities", "all" ]
    volumes:
      - $CLOUD_DIR/rick/files/Documents/Personal/3D prints:/prints:ro
      - $CONF_DIR/prints-portal-2/data:/data
    ports:
      - $LXC_IP:8004:8080
    environment:
      LOG_LEVEL: info
      # Optional; leave out for SQLite at /data/prints-portal.db
      # DATABASE_URL: postgres://prints_portal:<password>@<host>:5432/prints_portal
      INDEX_ON_STARTUP: true
      WATCH_ENABLED: true
      WATCH_DEBOUNCE_MS: 2000
      WATCH_POLLING: false # turn this on only if changes in your Nextcloud folder aren't picked up.
      WATCH_POLL_INTERVAL_MS: 5000
      SESSION_SECRET: $PRINTS_PORTAL_SECRET_KEY
      ADMIN_EMAIL: $PRINTS_PORTAL_ADMIN_EMAIL
      ADMIN_PASSWORD: $PRINTS_PORTAL_ADMIN_PASSWORD_2
      SPOOLMAN_URL: http://$LXC_PRODUCTIVITY_IP:8001
      TRUSTED_PROXIES: $LXC_INFRA_IP
      PUBLIC_URL: $PRINTS_PORTAL_2_PUBLIC_URL
      OIDC_ISSUER: $PRINTS_PORTAL_2_OIDC_ISSUER
      OIDC_CLIENT_ID: $PRINTS_PORTAL_2_CLIENT_ID
      OIDC_CLIENT_SECRET: $PRINTS_PORTAL_2_CLIENT_SECRET
      OIDC_ADMIN_GROUP: $PRINTS_PORTAL_2_ADMIN_GROUP
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
