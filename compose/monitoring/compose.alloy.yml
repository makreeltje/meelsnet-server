services:
  alloy:
    extends:
      file: ../fragments/common-service.yml
      service: common
    container_name: alloy
    image: grafana/alloy:v1.19.2
    profiles: [ "monitoring", "all" ]
    user: $PUID:$PGID
    environment:
      ALLOY_HOST_LABEL: $HOSTNAME
    volumes:
      - $CONF_DIR/alloy/config:/etc/alloy
      - $CONF_DIR/alloy/data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: [ "CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/12345" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
