services:
  loki:
    extends:
      file: ../fragments/common-service.yml
      service: common
    container_name: loki
    image: grafana/loki:3.7.7
    profiles: [ "monitoring", "all" ]
    user: $PUID:$PGID
    command:
      - -config.file=/mnt/config/loki-config.yaml
    volumes:
      - $CONF_DIR/loki/config:/mnt/config
      - $CONF_DIR/loki/data:/loki
    ports:
      - $LXC_IP:3100:3100
    healthcheck:
      test: [ "CMD", "/usr/bin/loki", "-health", "-health.url=http://localhost:3100/ready" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
