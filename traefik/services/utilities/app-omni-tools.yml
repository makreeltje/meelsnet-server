http:
  routers:
    omni-tools-rtr:
      rule: 'Host(`tools.int.meels.net`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-local-only
      service: omni-tools-svc
      tls:
        certResolver: dns-cloudflare
  services:
    omni-tools-svc:
      loadBalancer:
        servers:
          - url: 'http://{{env "LXC_PRODUCTIVITY_IP"}}:8083'
