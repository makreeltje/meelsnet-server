http:
  routers:
    prints-portal-2-rtr:
      rule: 'Host(`printer-2.{{env "DOMAINNAME_1"}}`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-no-auth
      service: prints-portal-2-svc
      tls:
        certResolver: dns-cloudflare
  services:
    prints-portal-2-svc:
      loadBalancer:
        servers:
          - url: 'http://{{env "LXC_PRODUCTIVITY_IP"}}:8004'
