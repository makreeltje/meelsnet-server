http:
  routers:
    spoolman-rtr:
      rule: 'Host(`spoolman.int.meels.net`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-local-only
      service: spoolman-svc
      tls:
        certResolver: dns-cloudflare
  services:
    spoolman-svc:
      loadBalancer:
        servers:
          - url: 'http://{{env "LXC_PRODUCTIVITY_IP"}}:8001'
