http:
  routers:
    convertx-rtr:
      rule: 'Host(`convert.int.{{env "DOMAINNAME_2"}}`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-local-only
      service: convertx-svc
      tls:
        certResolver: dns-cloudflare
  services:
    convertx-svc:
      loadBalancer:
        servers:
          - url: 'http://{{env "LXC_PRODUCTIVITY_IP"}}:3000'
