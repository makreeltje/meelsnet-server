http:
  routers:
    # --- ROUTER 1: Secure the Web UI (Default) ---
    portainer-rtr:
      rule: 'Host(`portainer.int.meels.net`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-local-only
      service: portainer-svc
      tls:
        certResolver: dns-cloudflare

  services:
    portainer-svc:
      loadBalancer:
        servers:
          - url: 'http://{{env "LXC_INFRA_IP"}}:9000'