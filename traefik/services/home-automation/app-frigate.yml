http:
  routers:
    frigate-rtr:
      rule: 'Host(`frigate.int.{{env "DOMAINNAME_2"}}`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-local-only
      service: frigate-svc
      tls:
        certResolver: dns-cloudflare
  services:
    frigate-svc:
      loadBalancer:
        servers:
          - url: 'http://{{env "LXC_HOME_IP"}}:5001'
