http:
  routers:
    nodered-rtr:
      rule: 'Host(`nodered.int.{{env "DOMAINNAME_2"}}`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-local-only
      service: nodered-svc
      tls:
        certResolver: dns-cloudflare
  services:
    nodered-svc:
      loadBalancer:
        servers:
          - url: 'http://{{env "LXC_HOME_IP"}}:1880'
