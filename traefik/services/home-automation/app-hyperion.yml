http:
  routers:
    hyperion-rtr:
      rule: 'Host(`hyperion.int.meels.net`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-local-only
      service: hyperion-svc
      tls:
        certResolver: dns-cloudflare
  services:
    hyperion-svc:
      loadBalancer:
        servers:
          - url: 'http://{{env "LXC_HOME_IP"}}:8090'
