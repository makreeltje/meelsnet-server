http:
  routers:
    unifi-rtr:
      rule: 'Host(`unifi.int.{{env "DOMAINNAME_2"}}`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-local-only
      service: unifi-svc
      tls:
        certResolver: dns-cloudflare
        options: tls-opts@file
  services:
    unifi-svc:
      loadBalancer:
        passHostHeader: true
        serversTransport: "pve"
        servers:
          - url: 'https://{{env "LXC_NETWORK_IP"}}:11443/'
  serversTransports:
    pve:
      insecureSkipVerify: true
