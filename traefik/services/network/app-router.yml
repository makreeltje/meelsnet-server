http:
  routers:
    router-rtr:
      rule: 'Host(`router.int.{{env "DOMAINNAME_2"}}`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-local-only
      service: router-svc
      tls:
        certResolver: dns-cloudflare
  services:
    router-svc:
      loadBalancer:
        passHostHeader: false
        servers:
          - url: 'http://192.168.2.254'
