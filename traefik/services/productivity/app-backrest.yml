http:
  routers:
    backrest-rtr:
      rule: 'Host(`backup.int.meels.net`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-local-only
      service: backrest-svc
      tls:
        certResolver: dns-cloudflare
  services:
    backrest-svc:
      loadBalancer:
        servers:
          - url: 'http://{{env "LXC_PRODUCTIVITY_IP"}}:9898'
