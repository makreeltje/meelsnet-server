http:
  routers:
    n8n-rtr:
      rule: 'Host(`n8n.int.{{env "DOMAINNAME_2"}}`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-local-only
      service: n8n-svc
      tls:
        certResolver: dns-cloudflare
  services:
    n8n-svc:
      loadBalancer:
        servers:
          - url: 'http://{{env "LXC_PRODUCTIVITY_IP"}}:5678'
