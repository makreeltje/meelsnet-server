http:
  routers:
    budget-tracker-rtr:
      rule: 'Host(`budget.{{env "DOMAINNAME_2"}}`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-local-only
      service: budget-tracker-svc
      tls:
        certResolver: dns-cloudflare
  services:
    budget-tracker-svc:
      loadBalancer:
        servers:
          - url: 'http://{{env "LXC_PRODUCTIVITY_IP"}}:8090'
