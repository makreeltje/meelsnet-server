http:
  routers:
    docuseal-rtr:
      rule: 'Host(`docuseal.{{env "DOMAINNAME_2"}}`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-no-auth
      service: docuseal-svc
      tls:
        certResolver: dns-cloudflare
  services:
    docuseal-svc:
      loadBalancer:
        servers:
          - url: 'http://{{env "LXC_PRODUCTIVITY_IP"}}:8092'
