http:
  routers:
    # --- ROUTER 1: Secure the Web UI (Default) ---
    sonarr-anime-rtr:
      rule: 'Host(`anime.int.meels.net`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-local-only
      service: sonarr-anime-svc
      tls:
        certResolver: dns-cloudflare

  services:
    sonarr-anime-svc:
      loadBalancer:
        servers:
          - url: 'http://{{env "LXC_MEDIA_IP"}}:8999'
