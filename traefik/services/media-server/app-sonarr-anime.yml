http:
  routers:
    # --- ROUTER 1: Secure the Web UI (Default) ---
    sonarr-anime-rtr:
      rule: 'Host(`anime.{{env "DOMAINNAME_1"}}`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-authentik
      service: sonarr-anime-svc
      tls:
        certResolver: dns-cloudflare

    # --- ROUTER 2: Bypass Auth for Helmarr/Quartermaster ---
    sonarr-anime-api-rtr:
      rule: 'Host(`anime.{{env "DOMAINNAME_1"}}`) && Header(`X-Homelab-Bypass`, `{{env "BYPASS_SECRET"}}`)'
      priority: 100
      entryPoints:
        - websecure
      middlewares:
        - chain-no-auth
      service: sonarr-anime-svc
      tls:
        certResolver: dns-cloudflare

  services:
    sonarr-anime-svc:
      loadBalancer:
        servers:
          - url: "http://{{env "LXC_MEDIA_IP"}}:8999"