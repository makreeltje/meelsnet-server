http:
  routers:
    # --- ROUTER 1: Secure the Web UI (Default) ---
    sonarr-rtr:
      rule: 'Host(`series.{{env "DOMAINNAME_2"}}`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-authentik-local
      service: sonarr-svc
      tls:
        certResolver: dns-cloudflare

  services:
    sonarr-svc:
      loadBalancer:
        servers:
          - url: 'http://{{env "LXC_MEDIA_IP"}}:8989'
