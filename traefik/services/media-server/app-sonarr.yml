http:
  routers:
    # --- ROUTER 1: Secure the Web UI (Default) ---
    sonarr-rtr:
      rule: 'Host(`sonarr.{{env "DOMAINNAME_1"}}`) || Host(`series.{{env "DOMAINNAME_1"}}`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-authentik
      service: sonarr-svc
      tls:
        certResolver: dns-cloudflare

    # --- ROUTER 2: Bypass Auth for Helmarr/Quartermaster ---
    sonarr-api-rtr:
      rule: '(Host(`sonarr.{{env "DOMAINNAME_1"}}`) || Host(`series.{{env "DOMAINNAME_1"}}`)) && Header(`X-Homelab-Bypass`, `{{env "BYPASS_SECRET"}}`)'
      priority: 100
      entryPoints:
        - websecure
      middlewares:
        - chain-no-auth
      service: sonarr-svc
      tls:
        certResolver: dns-cloudflare

  services:
    sonarr-svc:
      loadBalancer:
        servers:
          - url: 'http://{{env "LXC_MEDIA_IP"}}:8989'