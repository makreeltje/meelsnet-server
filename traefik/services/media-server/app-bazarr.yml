http:
  routers:
    # --- ROUTER 1: Secure the Web UI (Default) ---
    bazarr-rtr:
      rule: 'Host(`subtitles.int.meels.net`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-local-only
      service: bazarr-svc
      tls:
        certResolver: dns-cloudflare

  services:
    bazarr-svc:
      loadBalancer:
        servers:
          - url: 'http://{{env "LXC_MEDIA_IP"}}:6767'