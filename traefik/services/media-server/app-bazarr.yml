http:
  routers:
    # --- ROUTER 1: Secure the Web UI (Default) ---
    bazarr-rtr:
      rule: 'Host(`subtitles.{{env "DOMAINNAME_2"}}`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-authentik-local
      service: bazarr-svc
      tls:
        certResolver: dns-cloudflare

  services:
    bazarr-svc:
      loadBalancer:
        servers:
          - url: 'http://{{env "LXC_MEDIA_IP"}}:6767'