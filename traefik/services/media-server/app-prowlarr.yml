http:
  routers:
    # --- ROUTER 1: Secure the Web UI (Default) ---
    prowlarr-rtr:
      rule: 'Host(`prowlarr.{{env "DOMAINNAME_1"}}`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-authentik
      service: prowlarr-svc
      tls:
        certResolver: dns-cloudflare

    # --- ROUTER 2: Bypass Auth for Helmarr/Quartermaster ---
    prowlarr-api-rtr:
      rule: 'Host(`prowlarr.{{env "DOMAINNAME_1"}}`) && Header(`X-Homelab-Bypass`, `{{env "BYPASS_SECRET"}}`)'
      priority: 9999
      entryPoints:
        - websecure
      middlewares:
        - chain-no-auth
      service: prowlarr-svc
      tls:
        certResolver: dns-cloudflare

  services:
    prowlarr-svc:
      loadBalancer:
        servers:
          - url: 'http://{{env "LXC_MEDIA_IP"}}:9696'