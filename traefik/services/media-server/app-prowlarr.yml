http:
  routers:
    # --- ROUTER 1: Secure the Web UI (Default) ---
    prowlarr-rtr:
      rule: 'Host(`prowlarr.int.{{env "DOMAINNAME_2"}}`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-local-only
      service: prowlarr-svc
      tls:
        certResolver: dns-cloudflare

  services:
    prowlarr-svc:
      loadBalancer:
        servers:
          - url: 'http://{{env "LXC_MEDIA_IP"}}:9696'