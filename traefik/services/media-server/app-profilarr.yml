http:
  routers:
    profilarr-rtr:
      rule: 'Host(`profilarr.int.{{env "DOMAINNAME_2"}}`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-local-only
      service: profilarr-svc
      tls:
        certResolver: dns-cloudflare
  services:
    profilarr-svc:
      loadBalancer:
        servers:
          - url: 'http://{{env "LXC_MEDIA_IP"}}:6868'