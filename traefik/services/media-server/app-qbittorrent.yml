http:
  routers:
    # --- ROUTER 1: Secure the Web UI (Default) ---
    qbittorrent-rtr:
      rule: 'Host(`qbittorrent.int.meels.net`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-local-only
      service: qbittorrent-svc
      tls:
        certResolver: dns-cloudflare

  services:
    qbittorrent-svc:
      loadBalancer:
        servers:
          - url: 'http://{{env "LXC_MEDIA_IP"}}:8083'