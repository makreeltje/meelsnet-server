http:
  routers:
    watchstate-rtr:
      rule: 'Host(`watchstate.int.meels.net`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-local-only
      service: watchstate-svc
      tls:
        certResolver: dns-cloudflare
  services:
    watchstate-svc:
      loadBalancer:
        servers:
          - url: 'http://{{env "LXC_MEDIA_IP"}}:8081'