http:
  routers:
    watchstate-rtr:
      rule: 'Host(`watchstate.{{env "DOMAINNAME_1"}}`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-authentik
      service: watchstate-svc
      tls:
        certResolver: dns-cloudflare
  services:
    watchstate-svc:
      loadBalancer:
        servers:
          - url: "http://{{env "LXC_MEDIA_IP"}}:8081"