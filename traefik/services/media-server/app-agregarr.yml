http:
  routers:
    agregarr-rtr:
      rule: 'Host(`agregarr.int.meels.net`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-local-only
      service: agregarr-svc
      tls:
        certResolver: dns-cloudflare
  services:
    agregarr-svc:
      loadBalancer:
        servers:
          - url: 'http://{{env "LXC_MEDIA_IP"}}:7171'