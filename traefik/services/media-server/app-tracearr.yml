http:
  routers:
    tracearr-rtr:
      rule: 'Host(`tracearr.int.meels.net`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-local-only
      service: tracearr-svc
      tls:
        certResolver: dns-cloudflare
  services:
    tracearr-svc:
      loadBalancer:
        servers:
          - url: 'http://{{env "LXC_MEDIA_IP"}}:3000'