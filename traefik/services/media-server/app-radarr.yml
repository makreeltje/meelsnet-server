http:
  routers:
    # --- ROUTER 1: Secure the Web UI (Default) ---
    radarr-rtr:
      rule: 'Host(`movies.int.meels.net`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-local-only
      service: radarr-svc
      tls:
        certResolver: dns-cloudflare

  services:
    radarr-svc:
      loadBalancer:
        servers:
          - url: 'http://{{env "LXC_MEDIA_IP"}}:7878'
