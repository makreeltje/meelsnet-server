http:
  routers:
    notifiarr-rtr:
      rule: 'Host(`notifiarr.int.{{env "DOMAINNAME_2"}}`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-local-only
      service: notifiarr-svc
      tls:
        certResolver: dns-cloudflare
  services:
    notifiarr-svc:
      loadBalancer:
        servers:
          - url: 'http://{{env "LXC_MEDIA_IP"}}:5454'