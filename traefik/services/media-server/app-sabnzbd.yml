http:
  routers:
    # --- ROUTER 1: Secure the Web UI (Default) ---
    sabnzbd-rtr:
      rule: 'Host(`sab.{{env "DOMAINNAME_1"}}`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-authentik
      service: sabnzbd-svc
      tls:
        certResolver: dns-cloudflare

    # --- ROUTER 2: Bypass Auth for Helmarr/Quartermaster ---
    sabnzbd-api-rtr:
      rule: 'Host(`sab.{{env "DOMAINNAME_1"}}`) && Header(`X-Homelab-Bypass`, `{{env "BYPASS_SECRET"}}`)'
      priority: 100
      entryPoints:
        - websecure
      middlewares:
        - chain-no-auth
      service: sabnzbd-svc
      tls:
        certResolver: dns-cloudflare

  services:
    sabnzbd-svc:
      loadBalancer:
        servers:
          - url: 'http://{{env "LXC_MEDIA_IP"}}:8082'