http:
  routers:
    # --- ROUTER 1: Secure the Web UI (Default) ---
    sabnzbd-rtr:
      rule: 'Host(`sab.int.meels.net`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-local-only
      service: sabnzbd-svc
      tls:
        certResolver: dns-cloudflare

  services:
    sabnzbd-svc:
      loadBalancer:
        servers:
          - url: 'http://{{env "LXC_MEDIA_IP"}}:8082'