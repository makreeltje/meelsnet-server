http:
  routers:
    jackett-rtr:
      rule: 'Host(`jackett.int.meels.net`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-local-only
      service: jackett-svc
      tls:
        certResolver: dns-cloudflare
  services:
    jackett-svc:
      loadBalancer:
        servers:
          - url: 'http://{{env "LXC_MEDIA_IP"}}:9117'