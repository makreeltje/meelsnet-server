http:
  routers:
    # --- ROUTER 1: Secure the Web UI (Default) ---
    radarr-4k-rtr:
      rule: 'Host(`radarr-4k.{{env "DOMAINNAME_1"}}`) || Host(`movies-4k.{{env "DOMAINNAME_1"}}`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-authentik-local
      service: radarr-4k-svc
      tls:
        certResolver: dns-cloudflare

  services:
    radarr-4k-svc:
      loadBalancer:
        servers:
          - url: 'http://{{env "LXC_MEDIA_IP"}}:7879'