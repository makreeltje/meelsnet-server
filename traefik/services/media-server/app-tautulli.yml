http:
  routers:
    # --- ROUTER 1: Secure the Web UI (Default) ---
    tautulli-rtr:
      rule: 'Host(`tautulli.{{env "DOMAINNAME_1"}}`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-authentik
      service: tautulli-svc
      tls:
        certResolver: dns-cloudflare

    # --- ROUTER 2: Bypass Auth for Helmarr/Quartermaster ---
    tautulli-api-rtr:
      rule: 'Host(`tautulli.{{env "DOMAINNAME_1"}}`) && Header(`X-Homelab-Bypass`, `{{env "BYPASS_SECRET"}}`)'
      priority: 100
      entryPoints:
        - websecure
      middlewares:
        - chain-no-auth
      service: tautulli-svc
      tls:
        certResolver: dns-cloudflare

  services:
    tautulli-svc:
      loadBalancer:
        servers:
          - url: "http://{{env "LXC_MEDIA_IP"}}:8181"