http:
  routers:
    # --- ROUTER 1: Secure the Web UI (Default) ---
    tautulli-rtr:
      rule: 'Host(`tautulli.{{env "DOMAINNAME_1"}}`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-authentik
      service: tautulli-svc
      tls:
        certResolver: dns-cloudflare

  services:
    tautulli-svc:
      loadBalancer:
        servers:
          - url: 'http://{{env "LXC_MEDIA_IP"}}:8181'