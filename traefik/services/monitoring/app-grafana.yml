http:
  routers:
    grafana-rtr:
      rule: 'Host(`grafana.int.{{env "DOMAINNAME_2"}}`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-local-only
      service: grafana-svc
      tls:
        certResolver: dns-cloudflare
  services:
    grafana-svc:
      loadBalancer:
        servers:
          - url: 'http://{{env "LXC_MONITORING_IP"}}:3000'
