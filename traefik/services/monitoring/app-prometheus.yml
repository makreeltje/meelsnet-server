http:
  routers:
    prometheus-rtr:
      rule: 'Host(`prometheus.int.meels.net`)'
      entryPoints:
        - websecure
      middlewares:
        - chain-local-only
      service: prometheus-svc
      tls:
        certResolver: dns-cloudflare
  services:
    prometheus-svc:
      loadBalancer:
        servers:
          - url: 'http://{{env "LXC_MONITORING_IP"}}:9090'
